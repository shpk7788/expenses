<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Expenses</title>
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #111827; --muted: #6b7280;
    --line: #e5e7eb; --accent: #0f766e; --accent-ink: #ffffff; --danger: #b91c1c;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0f14; --card: #151b23; --text: #e5e7eb; --muted: #9ca3af;
      --line: #263040; --accent: #14b8a6; --accent-ink: #04201d; --danger: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin: 8px 0 16px; }
  h1 { font-size: 1.4rem; margin: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
  .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .summary div span { display: block; color: var(--muted); font-size: .8rem; }
  .summary div strong { font-size: 1.4rem; font-variant-numeric: tabular-nums; }
  form { display: grid; gap: 12px; }
  label { display: grid; gap: 4px; font-size: .85rem; color: var(--muted); }
  input {
    font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px; width: 100%;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button {
    font: inherit; border: 0; border-radius: 10px; padding: 12px 16px; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); font-weight: 600;
  }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); font-weight: 500; padding: 8px 12px; font-size: .85rem; }
  .month { margin-top: 8px; }
  .month-head { display: flex; justify-content: space-between; color: var(--muted); font-size: .85rem; padding: 4px 4px 8px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: grid; grid-template-columns: auto 1fr auto auto; gap: 12px; align-items: center; padding: 12px 4px; border-top: 1px solid var(--line); }
  li:first-child { border-top: 0; }
  .date { color: var(--muted); font-size: .8rem; width: 3.2em; text-align: center; line-height: 1.1; }
  .date b { display: block; font-size: 1.1rem; color: var(--text); }
  .what { overflow-wrap: anywhere; }
  .amt { font-variant-numeric: tabular-nums; font-weight: 600; }
  .icon-btn { background: transparent; color: var(--muted); padding: 6px 8px; font-weight: 400; }
  .icon-btn:hover { color: var(--danger); }
  .empty { color: var(--muted); text-align: center; padding: 24px 0; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .search { margin-bottom: 8px; }
  li.item { cursor: pointer; }
  li.item:hover .what { text-decoration: underline; text-decoration-color: var(--line); }
  li.editing { background: color-mix(in srgb, var(--accent) 10%, transparent); border-radius: 8px; }
  .form-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .form-head h2 { font-size: 1rem; margin: 0; }
  .scan { background: transparent; color: var(--accent); border: 1px solid var(--accent); padding: 8px 12px; font-size: .9rem; }
  .scan[disabled] { opacity: .6; cursor: progress; }
  .status { font-size: .85rem; color: var(--muted); min-height: 1.2em; margin: -4px 0 0; }
  .actions { display: grid; grid-template-columns: 1fr; gap: 8px; }
  .actions.editing { grid-template-columns: 1fr auto; }
  #cancelEdit { background: transparent; color: var(--muted); border: 1px solid var(--line); font-weight: 500; }
  .ac-wrap { position: relative; }
  .ac {
    position: absolute; z-index: 10; left: 0; right: 0; top: calc(100% + 4px);
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,.12); max-height: 320px; overflow-y: auto; display: none;
  }
  .ac.open { display: block; }
  .ac-sec { font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding: 8px 12px 4px; }
  .ac-opt { padding: 10px 12px; cursor: pointer; color: var(--text); }
  .ac-opt small { display: block; color: var(--muted); font-size: .8rem; }
  .ac-opt.active, .ac-opt:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .ac-note { padding: 10px 12px; color: var(--muted); font-size: .85rem; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: .9rem; display: none; gap: 12px; align-items: center; }
  .toast button { background: transparent; color: var(--bg); padding: 0; text-decoration: underline; font-weight: 600; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Expenses</h1>
    <div class="tools">
      <button class="ghost" id="exportBtn" type="button">Export CSV</button>
      <button class="ghost" id="importBtn" type="button">Import</button>
      <input type="file" id="importFile" accept=".csv,text/csv" hidden>
    </div>
  </header>

  <section class="card summary">
    <div><span id="monthLabel">This month</span><strong id="monthTotal">₹0</strong></div>
    <div><span>Today</span><strong id="todayTotal">₹0</strong></div>
  </section>

  <section class="card">
    <form id="form" autocomplete="off">
      <div class="form-head">
        <h2 id="formTitle">Add expense</h2>
        <button type="button" class="scan" id="scanBtn">📷 Scan receipt</button>
        <input type="file" id="scanFile" accept="image/*" hidden>
      </div>
      <p class="status" id="scanStatus"></p>
      <label>What was it for?
        <div class="ac-wrap">
          <input id="what" required placeholder="Type a store or item, e.g. DMart" enterkeyhint="next"
                 role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="ac">
          <div class="ac" id="ac" role="listbox"></div>
        </div>
      </label>
      <div class="row">
        <label>Amount (₹)
          <input id="amount" type="number" inputmode="decimal" step="0.01" min="0.01" required placeholder="0.00">
        </label>
        <label>Date
          <input id="date" type="date" required>
        </label>
      </div>
      <div class="actions" id="actions">
        <button type="submit" id="submitBtn">Add expense</button>
        <button type="button" id="cancelEdit" hidden>Cancel</button>
      </div>
    </form>
  </section>

  <section class="card">
    <input class="search" id="search" type="search" placeholder="Search expenses">
    <div id="list"></div>
  </section>
</main>

<div class="toast" id="toast"><span id="toastMsg"></span><button id="undoBtn" type="button">Undo</button></div>

<script src="receipt.js"></script>
<script>
(() => {
  const KEY = "expenses.v1";
  const $ = (id) => document.getElementById(id);
  const fmt = new Intl.NumberFormat("en-IN", { style: "currency", currency: "INR", maximumFractionDigits: 2 });

  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(items)); } catch {} };
  let items = load();
  let lastDeleted = null, toastTimer = null, editingId = null;

  const today = () => {
    const d = new Date();
    return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  };
  const resetDate = () => { $("date").value = today(); };

  function render() {
    const q = $("search").value.trim().toLowerCase();
    const t = today(), m = t.slice(0, 7);
    $("monthTotal").textContent = fmt.format(items.filter(e => e.date.startsWith(m)).reduce((s, e) => s + e.amount, 0));
    $("todayTotal").textContent = fmt.format(items.filter(e => e.date === t).reduce((s, e) => s + e.amount, 0));
    $("monthLabel").textContent = new Date(t + "T00:00").toLocaleDateString(undefined, { month: "long" });

    const shown = items
      .filter(e => !q || e.what.toLowerCase().includes(q))
      .sort((a, b) => b.date.localeCompare(a.date) || b.created - a.created);

    if (!shown.length) {
      $("list").innerHTML = `<p class="empty">${items.length ? "No matches." : "No expenses yet. Add your first one above."}</p>`;
      return;
    }
    const groups = {};
    shown.forEach(e => (groups[e.date.slice(0, 7)] ||= []).push(e));
    $("list").innerHTML = Object.entries(groups).map(([month, list]) => {
      const total = list.reduce((s, e) => s + e.amount, 0);
      const label = new Date(month + "-01T00:00").toLocaleDateString(undefined, { month: "long", year: "numeric" });
      return `<div class="month">
        <div class="month-head"><span>${label}</span><span>${fmt.format(total)}</span></div>
        <ul>${list.map(e => {
          const d = new Date(e.date + "T00:00");
          return `<li class="item${e.id === editingId ? " editing" : ""}" data-id="${e.id}" title="Tap to edit">
            <div class="date"><b>${d.getDate()}</b>${d.toLocaleDateString(undefined, { weekday: "short" })}</div>
            <div class="what">${esc(e.what)}</div>
            <div class="amt">${fmt.format(e.amount)}</div>
            <button class="icon-btn" data-del="${e.id}" aria-label="Delete">✕</button>
          </li>`;
        }).join("")}</ul></div>`;
    }).join("");
  }

  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

  function toast(msg, undo) {
    $("toastMsg").textContent = msg;
    $("undoBtn").style.display = undo ? "" : "none";
    $("toast").style.display = "flex";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { $("toast").style.display = "none"; lastDeleted = null; }, 4000);
  }

  $("form").addEventListener("submit", (ev) => {
    ev.preventDefault();
    const amount = parseFloat($("amount").value);
    const what = $("what").value.trim();
    if (!what || !(amount > 0)) return;
    const fields = { date: $("date").value || today(), what, amount: Math.round(amount * 100) / 100 };
    if (editingId) {
      const e = items.find(x => x.id === editingId);
      if (e) Object.assign(e, fields);
      toast("Saved");
    } else {
      items.push({ id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()), ...fields, created: Date.now() });
      toast("Added");
    }
    save(); stopEdit(); render();
    $("what").focus();
  });

  function startEdit(id) {
    const e = items.find(x => x.id === id); if (!e) return;
    editingId = id;
    $("what").value = e.what; $("amount").value = e.amount; $("date").value = e.date;
    $("formTitle").textContent = "Edit expense";
    $("submitBtn").textContent = "Save changes";
    $("cancelEdit").hidden = false; $("actions").classList.add("editing");
    $("scanStatus").textContent = "";
    render();
    $("form").scrollIntoView({ behavior: "smooth", block: "center" });
    $("amount").focus({ preventScroll: true }); $("amount").select();
  }
  function stopEdit() {
    editingId = null;
    $("what").value = ""; $("amount").value = ""; resetDate();
    $("formTitle").textContent = "Add expense";
    $("submitBtn").textContent = "Add expense";
    $("cancelEdit").hidden = true; $("actions").classList.remove("editing");
    closeAc();
  }
  $("cancelEdit").addEventListener("click", () => { stopEdit(); render(); });

  $("list").addEventListener("click", (ev) => {
    const id = ev.target.closest("[data-del]")?.dataset.del;
    if (!id) { const row = ev.target.closest("[data-id]"); if (row) startEdit(row.dataset.id); return; }
    if (id === editingId) stopEdit();
    const i = items.findIndex(e => e.id === id);
    if (i < 0) return;
    lastDeleted = items.splice(i, 1)[0];
    save(); render();
    toast("Deleted", true);
  });

  $("undoBtn").addEventListener("click", () => {
    if (lastDeleted) { items.push(lastDeleted); lastDeleted = null; save(); render(); }
    $("toast").style.display = "none";
  });

  $("search").addEventListener("input", render);

  $("exportBtn").addEventListener("click", () => {
    const rows = [["date", "what", "amount"], ...[...items].sort((a, b) => a.date.localeCompare(b.date)).map(e => [e.date, e.what, e.amount])];
    const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
    a.download = `expenses-${today()}.csv`;
    a.click();
  });

  $("importBtn").addEventListener("click", () => $("importFile").click());
  $("importFile").addEventListener("change", async (ev) => {
    const file = ev.target.files[0]; if (!file) return;
    const lines = parseCSV(await file.text());
    let added = 0;
    const seen = new Set(items.map(e => `${e.date}|${e.what}|${e.amount}`));
    lines.slice(1).forEach(([date, what, amount]) => {
      const amt = parseFloat(amount);
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date || "") || !what || !(amt > 0)) return;
      const k = `${date}|${what}|${amt}`; if (seen.has(k)) return; seen.add(k);
      items.push({ id: String(Date.now() + Math.random()), date, what, amount: amt, created: Date.now() });
      added++;
    });
    save(); render(); ev.target.value = "";
    toast(`Imported ${added} expense${added === 1 ? "" : "s"}`);
  });

  function parseCSV(text) {
    const rows = []; let row = [], cur = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) { if (c === '"' && text[i + 1] === '"') { cur += '"'; i++; } else if (c === '"') q = false; else cur += c; }
      else if (c === '"') q = true;
      else if (c === ",") { row.push(cur); cur = ""; }
      else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; }
      else cur += c;
    }
    if (cur || row.length) { row.push(cur); rows.push(row); }
    return rows;
  }

  // Keep the date on "today" if the app is left open past midnight
  document.addEventListener("visibilitychange", () => { if (!document.hidden && !$("amount").value && !$("what").value) { resetDate(); render(); } });

  // ---------- Store search (your past entries + OpenStreetMap via Photon) ----------
  const ac = $("ac"), whatEl = $("what");
  let acOpts = [], acIdx = -1, acTimer = null, acCtrl = null, coords = null, askedLoc = false;
  try { coords = JSON.parse(localStorage.getItem("expenses.loc")); } catch {}

  function askLocation() {
    if (askedLoc || !navigator.geolocation) return; askedLoc = true;
    navigator.geolocation.getCurrentPosition(p => {
      coords = { lat: +p.coords.latitude.toFixed(3), lon: +p.coords.longitude.toFixed(3) };
      try { localStorage.setItem("expenses.loc", JSON.stringify(coords)); } catch {}
      if (whatEl.value.trim().length >= 2) searchStores(whatEl.value.trim());
    }, () => {}, { maximumAge: 6e5, timeout: 1e4 });
  }

  function recentMatches(q) {
    const ql = q.toLowerCase(), seen = new Set(), out = [];
    [...items].sort((a, b) => b.created - a.created).forEach(e => {
      const k = e.what.toLowerCase();
      if (!seen.has(k) && k.includes(ql) && k !== ql) { seen.add(k); out.push({ name: e.what, sub: "" }); }
    });
    return out.slice(0, 4);
  }

  function drawAc(recent, stores, note) {
    acOpts = [...recent, ...stores]; acIdx = -1;
    let html = "", i = 0;
    if (recent.length) html += `<div class="ac-sec">Your recent</div>` + recent.map(o => `<div class="ac-opt" role="option" data-i="${i++}">${esc(o.name)}</div>`).join("");
    if (stores.length) html += `<div class="ac-sec">Stores${coords ? " near you" : ""}</div>` + stores.map(o => `<div class="ac-opt" role="option" data-i="${i++}">${esc(o.name)}${o.sub ? `<small>${esc(o.sub)}</small>` : ""}</div>`).join("");
    if (note) html += `<div class="ac-note">${esc(note)}</div>`;
    ac.innerHTML = html;
    const open = !!html && document.activeElement === whatEl;
    ac.classList.toggle("open", open); whatEl.setAttribute("aria-expanded", open);
  }
  function closeAc() { clearTimeout(acTimer); acCtrl?.abort(); ac.classList.remove("open"); whatEl.setAttribute("aria-expanded", "false"); acIdx = -1; }

  async function searchStores(q) {
    const recent = recentMatches(q);
    if (q.length < 3) { drawAc(recent, []); return; }
    drawAc(recent, [], "Searching stores…");
    acCtrl?.abort(); acCtrl = new AbortController();
    const url = new URL("https://photon.komoot.io/api/");
    url.searchParams.set("q", q); url.searchParams.set("limit", "20"); url.searchParams.set("lang", "en");
    if (coords) { url.searchParams.set("lat", coords.lat); url.searchParams.set("lon", coords.lon); url.searchParams.set("location_bias_scale", "0.5"); }
    try {
      const res = await fetch(url, { signal: acCtrl.signal });
      const data = await res.json();
      if (whatEl.value.trim() !== q) return;
      const keep = new Set(["shop", "amenity", "tourism", "leisure", "craft", "office", "healthcare"]);
      const seen = new Set(recent.map(r => r.name.toLowerCase()));
      const stores = [];
      for (const f of data.features || []) {
        const p = f.properties || {};
        if (!p.name || !keep.has(p.osm_key)) continue;
        const sub = [p.street || p.locality || p.district, p.city || p.county].filter(Boolean).filter((v, i, a) => a.indexOf(v) === i).join(", ");
        const key = (p.name + "|" + sub).toLowerCase();
        if (seen.has(key)) continue; seen.add(key);
        stores.push({ name: p.name, sub });
        if (stores.length >= 6) break;
      }
      drawAc(recent, stores, stores.length || recent.length ? "" : "No stores found. Just keep typing to use your own text.");
    } catch (err) {
      if (err.name !== "AbortError") drawAc(recent, [], recent.length ? "" : "Store search is unavailable right now.");
    }
  }

  function pickAc(i) {
    const o = acOpts[i]; if (!o) return;
    whatEl.value = o.name; closeAc();
    if (!$("amount").value) $("amount").focus();
  }

  whatEl.addEventListener("input", () => {
    askLocation();
    const q = whatEl.value.trim();
    clearTimeout(acTimer);
    if (!q) { acCtrl?.abort(); closeAc(); return; }
    acTimer = setTimeout(() => searchStores(q), 300);
  });
  whatEl.addEventListener("keydown", (ev) => {
    if (!ac.classList.contains("open") || !acOpts.length) return;
    const els = ac.querySelectorAll(".ac-opt");
    if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
      ev.preventDefault();
      acIdx = (acIdx + (ev.key === "ArrowDown" ? 1 : -1) + els.length) % els.length;
      els.forEach((el, i) => el.classList.toggle("active", i === acIdx));
      els[acIdx].scrollIntoView({ block: "nearest" });
    } else if (ev.key === "Enter" && acIdx >= 0) { ev.preventDefault(); pickAc(acIdx); }
    else if (ev.key === "Escape") closeAc();
  });
  ac.addEventListener("pointerdown", (ev) => {
    const el = ev.target.closest(".ac-opt"); if (!el) return;
    ev.preventDefault(); pickAc(+el.dataset.i);
  });
  whatEl.addEventListener("blur", () => setTimeout(closeAc, 150));

  // ---------- Receipt scanning (on-device OCR with Tesseract.js) ----------
  let tesseractLoading = null;
  function loadTesseract() {
    if (window.Tesseract) return Promise.resolve();
    return tesseractLoading ||= new Promise((ok, fail) => {
      const sc = document.createElement("script");
      sc.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
      sc.onload = ok; sc.onerror = () => { tesseractLoading = null; fail(new Error("Couldn't load the receipt reader. Check your connection.")); };
      document.head.appendChild(sc);
    });
  }

  async function prepImage(file) {
    const bmp = await createImageBitmap(file).catch(async () => {
      const img = new Image(); img.src = URL.createObjectURL(file); await img.decode(); return img;
    });
    const scale = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
    const g = c.getContext("2d"); g.drawImage(bmp, 0, 0, c.width, c.height);
    const px = g.getImageData(0, 0, c.width, c.height), d = px.data;
    for (let i = 0; i < d.length; i += 4) {           // grayscale + contrast boost
      let v = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      v = Math.max(0, Math.min(255, (v - 128) * 1.5 + 128));
      d[i] = d[i + 1] = d[i + 2] = v;
    }
    g.putImageData(px, 0, 0);
    return c;
  }

  $("scanBtn").addEventListener("click", () => $("scanFile").click());
  $("scanFile").addEventListener("change", async (ev) => {
    const file = ev.target.files[0]; ev.target.value = ""; if (!file) return;
    const btn = $("scanBtn"), st = $("scanStatus");
    btn.disabled = true; st.textContent = "Loading receipt reader…";
    try {
      const [, img] = await Promise.all([loadTesseract(), prepImage(file)]);
      const { data } = await Tesseract.recognize(img, "eng", {
        logger: m => { if (m.status === "recognizing text") st.textContent = `Reading receipt… ${Math.round(m.progress * 100)}%`; },
      });
      const r = parseReceipt(data.text || "");
      const found = [];
      if (r.store) { whatEl.value = r.store; found.push("store"); }
      if (r.amount) { $("amount").value = r.amount; found.push("amount"); }
      if (r.date) { $("date").value = r.date; found.push("date"); }
      st.textContent = found.length
        ? `Filled in ${found.join(", ")}. Check them, then tap ${editingId ? "Save" : "Add"}.`
        : "Couldn't read this receipt. Try a flatter, well-lit photo, or type it in.";
      (r.amount ? $("submitBtn") : r.store ? $("amount") : whatEl).focus();
    } catch (err) {
      st.textContent = err.message || "Something went wrong reading the receipt.";
    } finally { btn.disabled = false; }
  });

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

  resetDate(); render();
})();
</script>
</body>
</html>
